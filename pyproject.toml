[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:app.adapters.llm_groq",
    "ignore::DeprecationWarning:app.adapters.tts_edge",
    "ignore::DeprecationWarning:app.adapters.tts_cartesia",
    "ignore::DeprecationWarning:app.adapters.stt_deepgram",
    "ignore::DeprecationWarning:app.adapters.qdrant_retriever",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "qdrant_storage",
    "logs",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
