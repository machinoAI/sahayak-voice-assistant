services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sahayak-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  sahayak:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahayak-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=sahayak_kb
      - VOICE_PROFILE=production
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
    driver: local
