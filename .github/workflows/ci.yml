name: Sahayak CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system audio & codec dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libportaudio2 portaudio19-dev libsndfile1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint
        run: |
          ruff check app/ scripts/ tests/

      - name: Execute Test Suite (Isolated In-Memory Qdrant)
        env:
          QDRANT_PATH: ":memory:"
          DEEPGRAM_API_KEY: ""
          GROQ_API_KEY: ""
          CARTESIA_API_KEY: ""
        run: |
          pytest tests/ -v
